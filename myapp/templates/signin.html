{%extends 'base.html'%}
{%block content%}

{%load static%}

{% if message%}
<script>
    alert('{{message}}');
</script>
{% endif%}


<div class="container-xxl py-5 bg-dark hero-header mb-1">
  <div class="container text-center my-5 pt-5 pb-1">
      <h1 class="display-3 text-white mb-3 animated slideInDown">login</h1>
      <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center text-uppercase">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item"><a href="#">Login</a></li>
              {% comment %} <li class="breadcrumb-item text-white active" aria-current="page">Booking</li> {% endcomment %}
          </ol>
      </nav>
  </div>
</div>
<body>

</div>
    <link rel="stylesheet" href="/static/css/login.css">
    <div class="content-wrapper">
      <div class="wrapper">
          <div class="title-text">
              <div class="title login">Login Form</div>
              <div class="title signup">Signup Form</div>
          </div>
          <div class="form-container">
              <div class="slide-controls">
                  <input type="radio" name="slide" id="login" checked>
                  <input type="radio" name="slide" id="signup">
                  <label for="login" class="slide login">Login</label>
                  <label for="signup" class="slide signup">Signup</label>
                  <div class="slider-tab"></div>
              </div>
              <div class="form-inner">
                  <form  class="login" method = "POST">
                    {% csrf_token %}
                      <div class="field">
                          <input type="text" name='username1' placeholder="Username" required>
                      </div>
                      <div class="field">
                          <input type="password" name='password' placeholder="Password" required>
                      </div>
                      <div class="pass-link"><a href="#">Forgot password?</a></div>
                      <div class="field btn">
                          <div class="btn-layer"></div>
                          <input type="submit" name="login" value="Login" >
                      </div>
                      <div class="signup-link">Not a member? <a href="#">Signup now</a></div>
                  </form >

                  <form action="#" class="signup" method="POST">
                        {% csrf_token %}
                      <div class="field">
                          <input type="text" name="email" placeholder="Email Address" required>
                      </div>
                      <div class="field">
                        <input type="text" name="username1" placeholder="Username" required>
                    </div>
                      <div class="field">
                          <input type="password" name="password" placeholder="Password" required>
                      </div>
                      <div class="field">
                          <input type="password" name='cfpassword' placeholder="Confirm password" required>
                      </div>
                      <div class="field btn">
                          <div class="btn-layer"></div>
                          <input type="submit" name="signup" value="Signup">
                      </div>
                  </form>
              </div>
          </div>
      </div>
  </div>
  
    <script src='/static/js/login.js'></script>

 

  </body>
  

{%endblock%}
